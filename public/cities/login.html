<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><main class="wrap" style="max-width:460px;padding-top:9vh">
<a class="brand" href="/cities/login.html" style="margin-bottom:28px"><img src="/cities/logo.svg" alt=""><span><b>AI SUSTAINABLE CITIES</b><small data-t="sub">Cyprus · four schools</small></span></a>

</main><script src="/cities/login.js"></script></body></html>
